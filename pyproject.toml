[project]
name = "crucible-agents"
version = "0.1.0"
description = "Chaos, fuzz and regression QA for multi-agent networks — an agent network that tests agent networks."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Shubham Dubey", email = "itzshubhamofficial@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "neuro-san==0.7.12",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
artifacts = ["src/crucible/agents/registries/*.hocon", "src/crucible/agents/scripts/*.yaml"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
crucible = "crucible.interfaces.cli.app:main"

[project.optional-dependencies]
llm = [
    "langchain-anthropic>=1.7.6",
    "langchain-google-genai>=4.4.2",
]

[tool.ruff]
line-length = 119
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["docs", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT", "C4", "RET"]
# PLC0415: lazy imports are intentional (neuro_san is heavy; keep CLI startup fast).
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLC0415"]
# Video tooling embeds JS, CSS and ffmpeg graphs in strings, and uses "×" in on-screen speed badges.
"demo/**" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["neuro_san.*", "leaf_common.*", "networkx.*", "pyhocon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: runs Neuro-SAN in-process, keyless",
  "live: needs real LLM API keys",
  "e2e: end-to-end across interfaces",
]
